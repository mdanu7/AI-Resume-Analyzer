<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Resume Analyzer</title>
</head>

<body>

    <h1>AI Resume Analyzer</h1>

    <p>
        Upload your resume and get AI-powered
        job recommendations.
    </p>

    <form action="/analyze"
          method="POST"
          enctype="multipart/form-data">

        <input type="file"
               name="resume"
               accept=".pdf"
               required>

        <br><br>

        <button type="submit">
            Analyze Resume
        </button>

    </form>

</body>

</html>
